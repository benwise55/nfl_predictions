<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 Predictions</title>
  <!-- Tailwind CSS CDN for global static web hosting -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #0b0f19;
      --card: #121826;
      --border: #1e293b;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
      --accent: #10b981;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
    .badge-ats { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
    .badge-ou { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-4 sm:p-6 lg:p-8">

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Top Header -->
    <header class="pt-2 pb-1">
      <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 border-b border-[var(--border)] pb-4">
        <div>
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-[var(--foreground)]">
            Week 11 Predictions
          </h1>
          <p class="text-xs sm:text-sm text-[var(--muted-foreground)] mt-1 font-medium">
            Updated Nov 18, 2026 at 7:07 AM · 10,000 simulations per game
          </p>
        </div>
      </div>

      <!-- Controls: Day Filters, Search & Sort -->
      <div class="mt-4 flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
        
        <!-- Day Filters -->
        <div class="flex flex-wrap gap-1.5" id="day-filters">
          <button data-day="all" class="filter-day-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--primary)] text-white shadow-sm transition">
            All (13)
          </button>
          <button data-day="Thursday" class="filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition">
            Thu (1)
          </button>
          <button data-day="Sunday Early" class="filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition">
            Sun 1 PM (7)
          </button>
          <button data-day="Sunday Late" class="filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition">
            Sun 4 PM (3)
          </button>
          <button data-day="Sunday Night" class="filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition">
            SNF (1)
          </button>
          <button data-day="Monday" class="filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition">
            MNF (1)
          </button>
        </div>

        <!-- Search & Sorting -->
        <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search team or player..." 
            class="px-3 py-1.5 text-xs bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-lg focus:outline-none focus:border-[var(--primary)] placeholder-[var(--muted-foreground)]"
          />
          <select 
            id="sort-select" 
            class="px-3 py-1.5 text-xs bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-lg focus:outline-none focus:border-[var(--primary)] cursor-pointer"
          >
            <option value="time">Sort: Kickoff Time</option>
            <option value="ats_edge">Sort: Largest Spread Edge</option>
            <option value="win_pct">Sort: Most Lopsided Win %</option>
            <option value="close_game">Sort: Closest Game</option>
            <option value="total_score">Sort: Highest Total</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Games Grid Container -->
    <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Game cards rendered by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden bg-[var(--card)] border border-[var(--border)] rounded-2xl p-12 text-center">
      <p class="text-sm text-[var(--muted-foreground)]">No matchups found matching your current filter criteria.</p>
      <button onclick="resetFilters()" class="mt-3 px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)]">
        Reset Filters
      </button>
    </div>

  </div>

  <!-- Detailed Modal for Matchup, Player Stat Deciles & Covariance -->
  <div id="game-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl max-w-4xl w-full p-5 sm:p-7 shadow-2xl space-y-5 max-h-[94vh] overflow-y-auto">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-[var(--border)] pb-4">
        <div>
          <h3 id="modal-title" class="text-lg sm:text-xl font-bold text-[var(--foreground)]">Matchup Details</h3>
          <p id="modal-subtitle" class="text-xs text-[var(--muted-foreground)] mt-0.5">Explore simulated distributions and joint co-occurrence rates.</p>
        </div>
        <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)] text-2xl p-1 leading-none">✕</button>
      </div>

      <!-- Modal Navigation Tabs -->
      <div class="flex flex-wrap items-center gap-2 border-b border-[var(--border)] pb-3">
        <button id="modal-tab-fantasy" onclick="switchModalTab('fantasy')" class="px-4 py-2 text-xs font-bold rounded-lg bg-[var(--primary)] text-white transition-colors">
          Fantasy Projections
        </button>
        <button id="modal-tab-combo" onclick="switchModalTab('combo')" class="px-4 py-2 text-xs font-bold rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition-colors">
          Combo Props
        </button>
      </div>

      <!-- Modal Body Views -->
      <div id="modal-fantasy-view" class="space-y-5">
        <!-- Rendered by JS -->
      </div>

      <div id="modal-combo-view" class="space-y-5 hidden">
        <!-- Rendered by JS -->
      </div>

      <!-- Modal Footer -->
      <div class="pt-4 border-t border-[var(--border)] flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 text-xs font-medium rounded-lg bg-[var(--primary)] text-white">
          Close Window
        </button>
      </div>
    </div>
  </div>

    // ==========================================
    // UTILITIES & STAT HELPERS
    // ==========================================
    function probToAmericanOdds(p) {
      if (p <= 0.0001) return 'N/A';
      if (p >= 0.9999) return '-10000';
      if (p >= 0.5) {
        const odds = Math.round((p / (1 - p)) * -100);
        return odds <= -10000 ? '-10000' : `${odds}`;
      } else {
        const odds = Math.round(((1 - p) / p) * 100);
        return odds >= 10000 ? '+10000' : `+${odds}`;
      }
    }

    function getStatFriendlyName(statKey) {
      const map = {
        'qb_pass_yds': 'Passing Yards',
        'qb_pass_tds': 'Passing TDs',
        'qb_rush_yds': 'QB Rush Yards',
        'sacks_taken': 'Times Sacked',
        'sacks': 'Sacks Recorded',
        'rb_rush_yds': 'Rushing Yards',
        'rb_tot_yds': 'Total Yards (Rush+Rec)',
        'rb_rush_tds': 'Rushing TDs',
        'rb_rec': 'Receptions',
        'wr_rec_yds': 'Receiving Yards',
        'wr_rec_tds': 'Receiving TDs',
        'wr_rec': 'Receptions',
      };
      return map[statKey] || statKey.replace(/_/g, ' ');
    }

    // ==========================================
    // VIEW 1: COMBO PROPS ENGINE (DYNAMIC ROWS)
    // ==========================================
    function evalComboLeg(leg, g, s, N) {
      if (leg.category === 'player') {
        const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
        const p = teamPlayers.find(x => x.id === leg.playerId) || teamPlayers[0];
        if (!p) return new Array(N).fill(false);
        const op = leg.op || '>=';
        const val = Number(leg.val);

        if (leg.stat === 'tot_yds') {
          const rush = p.rush_yds || [];
          const rec = p.rec_yds || [];
          const res = new Array(N);
          for (let i = 0; i < N; i++) {
            const v = (rush[i] || 0) + (rec[i] || 0);
            res[i] = (op === '>=' ? v >= val : v <= val);
          }
          return res;
        }

        const arr = p[leg.stat];
        if (!arr || !arr.length) return new Array(N).fill(false);
        return arr.map(v => (op === '>=' ? v >= val : v <= val));
      } else if (leg.category === 'gameline') {
        const marginArr = s.margin; // positive = home win
        const type = leg.type || 'win';
        const side = leg.side || 'home';
        if (type === 'win') {
          return marginArr.map(m => (side === 'home' ? m >= 1 : -m >= 1));
        } else if (type === 'spread') {
          const spread = g.spread_line || 0;
          return marginArr.map(m => (side === 'home' ? m > spread : m < spread));
        } else if (type === 'margin') {
          const thresh = Number(leg.val) || 1.0;
          return marginArr.map(m => (side === 'home' ? m >= thresh : -m >= thresh));
        }
      } else if (leg.category === 'gametotal') {
        const totalArr = s.total;
        const op = leg.op || 'over';
        const val = Number(leg.val);
        return totalArr.map(t => (op === 'over' ? t >= val : t <= val));
      }
      return new Array(N).fill(true);
    }

    function getLegDisplaySummary(leg, g, s) {
      if (leg.category === 'player') {
        const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
        const p = teamPlayers.find(x => x.id === leg.playerId) || teamPlayers[0];
        const pName = p ? p.name : 'Player';
        const pos = p ? (p.slot || p.pos) : '';
        const statName = getStatFriendlyName(leg.stat);
        const opText = leg.op === '>=' ? 'Over' : 'Under';
        return `${pName} (${pos}): ${opText} ${leg.val} ${statName}`;
      } else if (leg.category === 'gameline') {
        const teamName = leg.side === 'home' ? g.home_name : g.away_name;
        if (leg.type === 'win') return `${teamName} Win Outright`;
        if (leg.type === 'spread') {
          const spText = g.spread_line > 0 ? (leg.side === 'home' ? `-${g.spread_line.toFixed(1)}` : `+${g.spread_line.toFixed(1)}`) : (leg.side === 'home' ? `+${Math.abs(g.spread_line).toFixed(1)}` : `-${Math.abs(g.spread_line).toFixed(1)}`);
          return `${teamName} Cover Spread (${spText})`;
        }
        return `${teamName} Win Margin >= ${leg.val} pts`;
      } else if (leg.category === 'gametotal') {
        return `Game Total Points ${leg.op.toUpperCase()} ${leg.val} pts`;
      }
      return 'Prop Leg';
    }

    function initComboLegs(g) {
      const s = g.sim_samples;
      const hPlayers = (s && s.players && s.players.home) ? s.players.home : [];
      const hQB = hPlayers.find(p => p.pos === 'QB') || hPlayers[0];
      const qbId = hQB ? hQB.id : '';
      const qbPassYds = (hQB && hQB.pass_yds) ? 225 : 200;

      comboLegs = [
        {
          id: nextLegId++,
          category: 'player',
          side: 'home',
          playerId: qbId,
          stat: 'pass_yds',
          op: '>=',
          val: qbPassYds
        },
        {
          id: nextLegId++,
          category: 'gametotal',
          op: 'over',
          val: (g && g.total_line) ? g.total_line : 43.5
        },
        {
          id: nextLegId++,
          category: 'gameline',
          side: 'home',
          type: 'margin',
          val: 10.0
        }
      ];
    }

    function addComboLeg(category = 'player') {
      const g = GAMES_DATA.find(x => x.game_id === activeModalGid);
      const s = g ? g.sim_samples : null;
      const totalDef = (g && g.total_line) ? g.total_line : 43.5;
      const leg = { id: nextLegId++, category };
      if (category === 'player') {
        leg.side = 'home';
        const teamPlayers = (s && s.players && s.players.home) ? s.players.home : [];
        const p = teamPlayers[0];
        leg.playerId = p ? p.id : '';
        if (p && (p.pos === 'DL' || p.pos === 'LB')) {
          leg.stat = 'sacks';
          leg.val = 0.5;
        } else {
          leg.stat = p && p.pass_yds ? 'pass_yds' : (p && p.rush_yds ? 'rush_yds' : (p && p.rec_yds ? 'rec_yds' : (p && p.sacks ? 'sacks' : 'sacks_taken')));
          leg.val = leg.stat === 'pass_yds' ? 225 : (leg.stat === 'rush_yds' ? 65.5 : (leg.stat === 'rec_yds' ? 55.5 : (leg.stat === 'sacks' ? 0.5 : 2.5)));
        }
        leg.op = '>=';
      } else if (category === 'gameline') {
        leg.side = 'home';
        leg.type = 'win';
        leg.val = 1.0;
      } else if (category === 'gametotal') {
        leg.op = 'over';
        leg.val = totalDef;
      }
      comboLegs.push(leg);
      renderComboPropsView();
    }

    function removeComboLeg(id) {
      comboLegs = comboLegs.filter(l => l.id !== id);
      renderComboPropsView();
    }

    function updateComboLeg(id, field, val) {
      const leg = comboLegs.find(l => l.id === id);
      if (!leg) return;
      const g = GAMES_DATA.find(x => x.game_id === activeModalGid);
      const s = g ? g.sim_samples : null;

      if (field === 'category') {
        leg.category = val;
        if (val === 'player') {
          leg.side = leg.side || 'home';
          const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
          const p = teamPlayers[0];
          leg.playerId = p ? p.id : '';
          if (p && (p.pos === 'DL' || p.pos === 'LB')) {
            leg.stat = 'sacks';
            leg.val = 0.5;
          } else {
            leg.stat = p && p.pass_yds ? 'pass_yds' : (p && p.rush_yds ? 'rush_yds' : (p && p.rec_yds ? 'rec_yds' : (p && p.sacks ? 'sacks' : 'sacks_taken')));
            leg.val = leg.stat === 'pass_yds' ? 225 : (leg.stat === 'rush_yds' ? 65.5 : (leg.stat === 'rec_yds' ? 55.5 : (leg.stat === 'sacks' ? 0.5 : 2.5)));
          }
          leg.op = '>=';
        } else if (val === 'gameline') {
          leg.side = leg.side || 'home';
          leg.type = 'win';
          leg.val = 1.0;
        } else if (val === 'gametotal') {
          leg.op = 'over';
          leg.val = (g && g.total_line) ? g.total_line : 43.5;
        }
      } else if (field === 'side') {
        leg.side = val;
        if (leg.category === 'player') {
          const teamPlayers = (s && s.players && s.players[val]) ? s.players[val] : [];
          const p = teamPlayers[0];
          leg.playerId = p ? p.id : '';
          if (p && (p.pos === 'DL' || p.pos === 'LB')) {
            leg.stat = 'sacks';
            leg.val = 0.5;
          } else {
            leg.stat = p && p.pass_yds ? 'pass_yds' : (p && p.rush_yds ? 'rush_yds' : (p && p.rec_yds ? 'rec_yds' : (p && p.sacks ? 'sacks' : 'sacks_taken')));
            leg.val = leg.stat === 'pass_yds' ? 225 : (leg.stat === 'rush_yds' ? 65.5 : (leg.stat === 'rec_yds' ? 55.5 : (leg.stat === 'sacks' ? 0.5 : 2.5)));
          }
        }
      } else if (field === 'playerId') {
        leg.playerId = val;
        const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
        const p = teamPlayers.find(x => x.id === val);
        if (p) {
          if (p.pos === 'DL' || p.pos === 'LB') {
            leg.stat = 'sacks';
            leg.val = 0.5;
          } else {
            const hasPass = p.pass_yds && p.pass_yds.length;
            const hasRush = p.rush_yds && p.rush_yds.length;
            const hasRec = p.rec_yds && p.rec_yds.length;
            const hasSacksTaken = p.sacks_taken && p.sacks_taken.length;
            let valid = false;
            if (leg.stat === 'pass_yds' || leg.stat === 'pass_tds') valid = hasPass;
            else if (leg.stat === 'sacks_taken') valid = hasSacksTaken;
            else if (leg.stat === 'rush_yds' || leg.stat === 'rush_tds') valid = hasRush;
            else if (leg.stat === 'rec_yds' || leg.stat === 'rec_tds' || leg.stat === 'rec') valid = hasRec;
            else if (leg.stat === 'tot_yds') valid = hasRush && hasRec;

            if (!valid) {
              if (hasPass) { leg.stat = 'pass_yds'; leg.val = 225; }
              else if (hasRush) { leg.stat = 'rush_yds'; leg.val = 65.5; }
              else if (hasRec) { leg.stat = 'rec_yds'; leg.val = 45.5; }
              else if (hasSacksTaken) { leg.stat = 'sacks_taken'; leg.val = 2.5; }
            }
          }
        }
      } else if (field === 'stat') {
        leg.stat = val;
        if (val === 'pass_yds') leg.val = 225;
        else if (val === 'pass_tds') leg.val = 1.5;
        else if (val === 'sacks_taken') leg.val = 2.5;
        else if (val === 'sacks') leg.val = 0.5;
        else if (val === 'rush_yds') {
          const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
          const p = teamPlayers.find(x => x.id === leg.playerId);
          leg.val = (p && p.pos === 'QB') ? 15.5 : 65.5;
        }
        else if (val === 'rush_tds') leg.val = 0.5;
        else if (val === 'rec_yds') leg.val = 45.5;
        else if (val === 'rec_tds') leg.val = 0.5;
        else if (val === 'rec') leg.val = 3.5;
        else if (val === 'tot_yds') leg.val = 75.5;
      } else if (field === 'type') {
        leg.type = val;
        if (val === 'win') leg.val = 1.0;
        else if (val === 'spread') leg.val = (g && g.spread_line) ? Math.abs(g.spread_line) : 3.0;
        else if (val === 'margin') leg.val = 10.0;
      } else {
        leg[field] = val;
      }
      renderComboPropsView();
    }

    function setComboPreset(preset) {
      const g = GAMES_DATA.find(x => x.game_id === activeModalGid);
      const s = g ? g.sim_samples : null;
      const totalLine = (g && g.total_line) ? g.total_line : 43.5;
      const spreadAbs = (g && g.spread_line) ? Math.abs(g.spread_line) : 3.0;
      nextLegId = 1;

      const hPlayers = (s && s.players && s.players.home) ? s.players.home : [];
      const aPlayers = (s && s.players && s.players.away) ? s.players.away : [];
      const hQB = hPlayers.find(p => p.pos === 'QB') || hPlayers[0];
      const aQB = aPlayers.find(p => p.pos === 'QB') || aPlayers[0];
      const hRB = hPlayers.find(p => p.pos === 'RB') || hPlayers[0];

      if (preset === 'user_250') {
        comboLegs = [
          { id: nextLegId++, category: 'player', side: 'home', playerId: hQB ? hQB.id : '', stat: 'pass_yds', op: '>=', val: 250 },
          { id: nextLegId++, category: 'gametotal', op: 'over', val: 42.0 },
          { id: nextLegId++, category: 'gameline', side: 'home', type: 'margin', val: 10.0 }
        ];
      } else if (preset === 'user_200') {
        comboLegs = [
          { id: nextLegId++, category: 'player', side: 'home', playerId: hQB ? hQB.id : '', stat: 'pass_yds', op: '>=', val: 200 },
          { id: nextLegId++, category: 'gametotal', op: 'over', val: 42.0 },
          { id: nextLegId++, category: 'gameline', side: 'home', type: 'margin', val: 10.0 }
        ];
      } else if (preset === 'shootout') {
        comboLegs = [
          { id: nextLegId++, category: 'gametotal', op: 'over', val: totalLine },
          { id: nextLegId++, category: 'player', side: 'home', playerId: hQB ? hQB.id : '', stat: 'pass_tds', op: '>=', val: 1.5 },
          { id: nextLegId++, category: 'player', side: 'away', playerId: aQB ? aQB.id : '', stat: 'pass_yds', op: '>=', val: 225 }
        ];
      } else if (preset === 'ground_pound') {
        comboLegs = [
          { id: nextLegId++, category: 'player', side: 'home', playerId: hRB ? hRB.id : '', stat: 'rush_yds', op: '>=', val: 65.5 },
          { id: nextLegId++, category: 'gameline', side: 'home', type: 'win', val: 1.0 },
          { id: nextLegId++, category: 'gametotal', op: 'under', val: totalLine }
        ];
      } else if (preset === 'fav_cover_under') {
        const favSide = (g && g.p_home_win >= g.p_away_win) ? 'home' : 'away';
        comboLegs = [
          { id: nextLegId++, category: 'gameline', side: favSide, type: 'spread', val: spreadAbs },
          { id: nextLegId++, category: 'gametotal', op: 'under', val: totalLine }
        ];
      } else if (preset === 'sack_havoc') {
        comboLegs = [
          { id: nextLegId++, category: 'player', side: 'home', playerId: hQB ? hQB.id : '', stat: 'sacks_taken', op: '>=', val: 2.5 },
          { id: nextLegId++, category: 'gametotal', op: 'under', val: totalLine }
        ];
      }
      renderComboPropsView();
    }

    function renderComboPropsView() {
      const g = GAMES_DATA.find(x => x.game_id === activeModalGid);
      if (!g) return;

      const container = document.getElementById('modal-combo-view');
      if (!g.sim_samples) {
        if (GAME_SAMPLES_ERROR[g.game_id]) {
          container.innerHTML = `
            <div class="p-8 text-center bg-[var(--background)] rounded-xl border border-[var(--border)] space-y-3">
              <div class="text-sm font-bold text-rose-400">Could not load game simulations</div>
              <p class="text-xs text-[var(--muted-foreground)]">${GAME_SAMPLES_ERROR[g.game_id]}. Per-game sample files require serving over HTTP (e.g. GitHub Pages).</p>
              <button onclick="ensureGameSamples('${g.game_id}', true); renderComboPropsView();" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--primary)] text-white">Retry</button>
            </div>
          `;
        } else {
          ensureGameSamples(g.game_id);
          container.innerHTML = `
            <div class="p-10 text-center bg-[var(--background)] rounded-xl border border-[var(--border)] space-y-2.5">
              <div class="inline-block w-6 h-6 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
              <div class="text-sm font-bold text-[var(--foreground)]">Loading ${N_SIMS_PER_GAME.toLocaleString()} simulated game scripts...</div>
              <div class="text-xs text-[var(--muted-foreground)]">${g.away_name} @ ${g.home_name}</div>
            </div>
          `;
        }
        return;
      }
      if (comboLegs.length === 0) initComboLegs(g);
      const s = g.sim_samples;
      const N = s.n_sims || s.margin.length;

      // Evaluate each leg across all N game scripts
      const legResults = comboLegs.map(leg => {
        const matches = evalComboLeg(leg, g, s, N);
        const count = matches.filter(Boolean).length;
        const prob = count / N;
        const summary = getLegDisplaySummary(leg, g, s);
        return { leg, matches, count, prob, summary };
      });

      // Joint Evaluation across all legs
      let joint_count = 0;
      for (let i = 0; i < N; i++) {
        let allMatch = true;
        for (let j = 0; j < legResults.length; j++) {
          if (!legResults[j].matches[i]) {
            allMatch = false;
            break;
          }
        }
        if (allMatch) joint_count++;
      }

      const p_joint = legResults.length > 0 ? (joint_count / N) : 0;
      const p_indep = legResults.length > 0 ? legResults.reduce((acc, r) => acc * r.prob, 1.0) : 0;
      const multiplier = p_indep > 0 ? (p_joint / p_indep) : (p_joint > 0 ? 99.0 : 1.0);

      // Correlation / Synergy Badge
      let synergyBadge = '';
      if (legResults.length === 0) {
        synergyBadge = `<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-500/10 text-slate-300 border border-slate-500/20">No Legs Configured</span>`;
      } else if (p_joint === 0 && p_indep > 0) {
        synergyBadge = `<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">0 Observed Instances</span>`;
      } else if (multiplier >= 1.25) {
        synergyBadge = `<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Positive Correlation (+${Math.round((multiplier - 1) * 100)}%)</span>`;
      } else if (multiplier <= 0.8) {
        synergyBadge = `<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">Negative Drag (${Math.round((multiplier - 1) * 100)}%)</span>`;
      } else {
        synergyBadge = `<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-500/10 text-slate-300 border border-slate-500/20">Independent (${multiplier.toFixed(2)}x)</span>`;
      }

      container.innerHTML = `
        <!-- Dynamic Prop Rows Container -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-[var(--foreground)]">
              Active Legs (${comboLegs.length})
            </span>
            <div class="flex items-center gap-1.5">
              <button onclick="addComboLeg('player')" class="px-2.5 py-1 text-xs font-semibold rounded bg-[var(--card)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-colors">
                + Add Player Prop
              </button>
              <button onclick="addComboLeg('gameline')" class="px-2.5 py-1 text-xs font-semibold rounded bg-[var(--card)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-colors">
                + Add Game Line
              </button>
              <button onclick="addComboLeg('gametotal')" class="px-2.5 py-1 text-xs font-semibold rounded bg-[var(--card)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-colors">
                + Add Over/Under
              </button>
            </div>
          </div>

          ${comboLegs.length === 0 ? `
            <div class="p-6 text-center rounded-xl bg-[var(--background)] border border-[var(--border)] text-xs text-[var(--muted-foreground)]">
              No prop legs currently added. Click one of the buttons above or select a preset to begin.
            </div>
          ` : comboLegs.map((leg, idx) => {
            const r = legResults[idx] || { count: 0, prob: 0 };
            const teamPlayers = (s && s.players && s.players[leg.side]) ? s.players[leg.side] : [];
            const curPlayer = teamPlayers.find(p => p.id === leg.playerId) || teamPlayers[0];
            const selectedPid = curPlayer ? curPlayer.id : '';

    // ==========================================
    // VIEW: FANTASY PROJECTIONS & HISTOGRAM
    // ==========================================

    function getPlayerSeasonStats(pInfo) {
      if (!pInfo) return null;
      const uidNorm = (pInfo.uid || '').replace(/^P/, '');
      const nameNorm = (pInfo.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      return SEASON_STATS[uidNorm] || SEASON_STATS[nameNorm] || null;
    }

    function getPlayerStatSamples(simP, pInfo, statKey) {
      if (!simP) return [];

      if (statKey === 'fantasy_pts') {
        if (pInfo.pos === 'QB') {
          const passYds = simP.pass_yds || [];
          const passTds = simP.pass_tds || [];
          const rushYds = simP.rush_yds || [];
          const rushTds = simP.rush_tds || [];
          const meanInts = pInfo.metrics?.find(m => m.key === 'interceptions')?.data?.mean || 0.8;
          const intDeduct = meanInts * 2.0;
          return passYds.map((py, idx) => {
            const ptd = passTds[idx] || 0;
            const ry = rushYds[idx] || 0;
            const rtd = rushTds[idx] || 0;
            const pts = py * 0.04 + ptd * 4.0 + ry * 0.10 + rtd * 6.0 - intDeduct;
            return Math.max(0, Number(pts.toFixed(1)));
          });
        } else if (pInfo.pos === 'RB') {
          const rushYds = simP.rush_yds || [];
          const rushTds = simP.rush_tds || [];
          const rec = simP.rec || [];
          const recYds = simP.rec_yds || [];
          const recTds = simP.rec_tds || [];
          return rushYds.map((ry, idx) => {
            const rtd = rushTds[idx] || 0;
            const rc = rec[idx] || 0;
            const rcy = recYds[idx] || 0;
            const rctd = recTds[idx] || 0;
            const pts = ry * 0.10 + rtd * 6.0 + rc * 0.50 + rcy * 0.10 + rctd * 6.0;
            return Math.max(0, Number(pts.toFixed(1)));
          });
        } else if (pInfo.pos === 'WR' || pInfo.pos === 'TE') {
          const rec = simP.rec || [];
          const recYds = simP.rec_yds || [];
          const recTds = simP.rec_tds || [];
          return (recYds.length ? recYds : rec).map((_, idx) => {
            const rc = rec[idx] || 0;
            const rcy = recYds[idx] || 0;
            const rctd = recTds[idx] || 0;
            const pts = rc * 0.50 + rcy * 0.10 + rctd * 6.0;
            return Math.max(0, Number(pts.toFixed(1)));
          });
        } else if (pInfo.pos === 'DL' || pInfo.pos === 'LB') {
          const sacks = simP.sacks || [];
          return sacks.map(s => Number((s * 2.0).toFixed(1)));
        }
      }

      if (statKey === 'tot_yds') {
        if (pInfo.pos === 'QB') {
          const passYds = simP.pass_yds || [];
          const rushYds = simP.rush_yds || [];
          return passYds.map((py, idx) => py + (rushYds[idx] || 0));
        } else {
          const rushYds = simP.rush_yds || [];
          const recYds = simP.rec_yds || [];
          const len = Math.max(rushYds.length, recYds.length);
          const out = [];
          for (let i = 0; i < len; i++) {
            out.push((rushYds[i] || 0) + (recYds[i] || 0));
          }
          return out;
        }
      }

      if (statKey === 'tot_tds') {
        if (pInfo.pos === 'QB') {
          const passTds = simP.pass_tds || [];
          const rushTds = simP.rush_tds || [];
          return passTds.map((pt, idx) => pt + (rushTds[idx] || 0));
        } else {
          const rushTds = simP.rush_tds || [];
          const recTds = simP.rec_tds || [];
          const len = Math.max(rushTds.length, recTds.length);
          const out = [];
          for (let i = 0; i < len; i++) {
            out.push((rushTds[i] || 0) + (recTds[i] || 0));
          }
          return out;
        }
      }

      if (simP[statKey] && Array.isArray(simP[statKey])) {
        return simP[statKey];
      }

      return [];
    }

    function computeHistogram(samples, isDiscrete, threshVal, threshOp) {
      if (!samples || samples.length === 0) return [];
      const N = samples.length;

      if (isDiscrete) {
        const counts = {};
        let maxObs = 0;
        samples.forEach(v => {
          const intV = Math.round(v);
          counts[intV] = (counts[intV] || 0) + 1;
          if (intV > maxObs) maxObs = intV;
        });

        const topCutoff = Math.min(Math.max(4, maxObs), 6);
        const bins = [];

        for (let i = 0; i <= topCutoff; i++) {
          if (i === topCutoff && maxObs > topCutoff) {
            let c = 0;
            for (let k = topCutoff; k <= maxObs; k++) {
              c += (counts[k] || 0);
            }
            const pct = Math.round((c / N) * 1000) / 10;
            const isHit = threshVal != null ? (threshOp === '>=' ? topCutoff >= threshVal : topCutoff <= threshVal) : false;
            bins.push({ label: `${topCutoff}+`, min: topCutoff, max: 999, count: c, pct, isHit });
          } else {
            const c = counts[i] || 0;
            const pct = Math.round((c / N) * 1000) / 10;
            const isHit = threshVal != null ? (threshOp === '>=' ? i >= threshVal : i <= threshVal) : false;
            bins.push({ label: `${i}`, min: i, max: i, count: c, pct, isHit });
          }
        }
        return bins;
      } else {
        let minV = Math.floor(Math.min(...samples));
        let maxV = Math.ceil(Math.max(...samples));
        if (minV === maxV) maxV = minV + 10;
        const nBins = 12;
        const rawStep = (maxV - minV) / nBins;
        const step = rawStep > 5 ? Math.round(rawStep) : (Math.round(rawStep * 10) / 10 || 1);

        const bins = [];
        for (let b = 0; b < nBins; b++) {
          const low = Number((minV + b * step).toFixed(1));
          const high = Number((minV + (b + 1) * step).toFixed(1));
          const isLast = b === nBins - 1;

          let count = 0;
          for (let i = 0; i < N; i++) {
            const v = samples[i];
            if (isLast ? (v >= low && v <= high + 0.0001) : (v >= low && v < high)) {
              count++;
            }
          }
          const pct = Math.round((count / N) * 1000) / 10;
          const isHit = threshVal != null ? (threshOp === '>=' ? high > threshVal : low < threshVal) : false;
          bins.push({
            label: `${Math.round(low)}`,
            rangeLabel: `${low}–${high}`,
            min: low,
            max: high,
            count,
            pct,
            isHit
          });
        }
        return bins;
      }
    }

                  <div class="flex-1 min-w-[32px] h-full flex flex-col justify-end items-center group relative cursor-pointer" onclick="updateHistThreshold(${bin.min})">
                    <!-- Tooltip -->
                    <div class="absolute -top-8 bg-slate-900 border border-slate-700 text-white text-[10px] py-1 px-2 rounded shadow-xl pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity z-20 whitespace-nowrap">
                      ${bin.rangeLabel || bin.label}: <strong>${bin.count.toLocaleString()} games</strong> (${bin.pct.toFixed(1)}%)
                    </div>
                    <!-- Pct Label on Bar Top -->
                    <span class="text-[9px] font-mono text-[var(--muted-foreground)] mb-1 opacity-80 group-hover:opacity-100">
                      ${bin.pct >= 5 ? bin.pct.toFixed(0) + '%' : ''}
                    </span>
                    <!-- Bar Fill -->
                    <div 
                      class="w-full rounded-t-md transition-all duration-150 ${bin.isHit ? 'bg-gradient-to-t from-emerald-600 to-teal-400 shadow-md ring-1 ring-emerald-400/50' : 'bg-slate-700/60 hover:bg-slate-600'}" 
                      style="height: ${Math.max(6, (bin.pct / maxBinPct) * 85)}%"
                    ></div>
                    <!-- Axis Label -->
                    <span class="text-[10px] font-mono text-[var(--muted-foreground)] mt-1.5 truncate max-w-full text-center group-hover:text-[var(--foreground)]">
                      ${bin.label}
                    </span>
                  </div>
                `).join('')}
              </div>

              <!-- Interactive Threshold Calculator -->
              <div class="pt-3 border-t border-[var(--border)] flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-[var(--card)]/50 p-3 rounded-lg border">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-[var(--foreground)]">Probability Calculator:</span>
                  <div class="inline-flex rounded-md border border-[var(--border)] p-0.5 bg-[var(--card)]">
                    <button onclick="updateHistOp('>=')" class="px-2 py-0.5 text-xs font-bold rounded ${histThresholdOp === '>=' ? 'bg-[var(--primary)] text-white shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
                      Over (>=)
                    </button>
                    <button onclick="updateHistOp('<=')" class="px-2 py-0.5 text-xs font-bold rounded ${histThresholdOp === '<=' ? 'bg-[var(--primary)] text-white shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
                      Under (<=)
                    </button>
                  </div>
                  <input 
                    type="number" 
                    step="${curStatOpt.isDiscrete ? '1' : '0.5'}" 
                    value="${histThresholdVal}" 
                    oninput="updateHistThreshold(this.value)" 
                    class="w-20 text-xs p-1.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] font-mono font-bold" 
                  />
                  <span class="text-xs text-[var(--muted-foreground)]">${curStatOpt.isDiscrete ? 'count' : 'stat'}</span>
                </div>

                <div class="flex items-baseline gap-2.5 sm:ml-auto">
                  <div class="text-right">
                    <div class="text-xs text-[var(--muted-foreground)]">${histThresholdOp === '>=' ? 'Over' : 'Under'} ${histThresholdVal} Probability:</div>
                    <div class="text-lg font-black text-emerald-400">${(hitProb * 100).toFixed(1)}%</div>
                  </div>
                  <div class="text-right pl-3 border-l border-[var(--border)]">
                    <div class="text-xs text-[var(--muted-foreground)]">Fair Odds:</div>
                    <div class="text-sm font-mono font-bold text-[var(--foreground)]">${fairOdds}</div>
                  </div>
                  <div class="text-right pl-3 border-l border-[var(--border)] text-xs text-[var(--muted-foreground)]">
                    <div>Sim Hits:</div>
                    <strong class="text-[var(--foreground)]">${hitCount.toLocaleString()} / ${N.toLocaleString()}</strong>
                  </div>
                </div>
              </div>
            </div>
            `)}
          </div>

          <!-- Section B: 2026 Season Stats vs. Model Projection (Sanity Check Table) -->
          <div class="space-y-2 pt-2">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-[var(--foreground)]">
                  Season Reality Check & Performance Baseline
                </span>
                <span class="text-xs text-[var(--muted-foreground)] ml-2">
                  ${seasonStats ? `(2026 Regular Season: ${seasonStats.gp} Games Played)` : '(No 2026 Regular Season Game Data Recorded)'}
                </span>
              </div>
              ${seasonStats ? `
                <span class="text-xs text-emerald-400 font-semibold font-mono">
                  ${seasonStats.pg_fantasy.toFixed(1)} pts/G Season Avg
                </span>
              ` : ''}
            </div>

            <div class="border border-[var(--border)] rounded-xl overflow-hidden">
              <table class="w-full text-xs text-left">
                <thead class="bg-[var(--background)] text-[var(--muted-foreground)] border-b border-[var(--border)]">
                  <tr>
                    <th class="p-2.5 font-semibold">Stat Category</th>
                    <th class="p-2.5 text-center font-semibold text-[var(--foreground)]">Week Proj (Mean)</th>
                    <th class="p-2.5 text-center font-semibold text-[var(--foreground)]">2026 Per-Game</th>
                    <th class="p-2.5 text-center font-semibold text-[var(--muted-foreground)]">2026 Season Total</th>
                    <th class="p-2.5 text-right font-semibold">Proj vs Actual Diff</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border)]">
                  ${sanityRows.map(r => {
                    let diffDisplay = `<span class="text-[var(--muted-foreground)]">-</span>`;
                    if (r.proj != null && r.pg != null) {
                      const diff = r.proj - r.pg;
                      const diffPct = r.pg > 0 ? (diff / r.pg) * 100 : 0;
                      if (diff > 0.05) {
                        diffDisplay = `<span class="text-emerald-400 font-bold font-mono">+${diff.toFixed(1)} (+${Math.round(diffPct)}%)</span>`;
                      } else if (diff < -0.05) {
                        diffDisplay = `<span class="text-amber-400 font-bold font-mono">${diff.toFixed(1)} (${Math.round(diffPct)}%)</span>`;
                      } else {
                        diffDisplay = `<span class="text-[var(--muted-foreground)] font-mono">Even (0.0)</span>`;
                      }
                    }

                    const projDisplay = r.proj != null ? r.proj.toFixed(1) : '-';
                    const pgDisplay = r.pg != null ? (typeof r.pg === 'number' ? r.pg.toFixed(1) : r.pg) : '-';
                    const totDisplay = r.tot != null ? (typeof r.tot === 'number' ? (r.tot % 1 === 0 ? r.tot : r.tot.toFixed(1)) : r.tot) : '-';

                    return `
                      <tr class="${r.isMain ? 'bg-emerald-500/5 font-bold' : 'hover:bg-[var(--background)]/40 transition-colors'}">
                        <td class="p-2.5 text-[var(--foreground)]">
                          ${r.metric}
                        </td>
                        <td class="p-2.5 text-center font-mono font-bold text-[var(--foreground)]">
                          ${projDisplay} ${r.unit ? `<span class="text-[10px] font-normal text-[var(--muted-foreground)]">${r.unit}</span>` : ''}
                        </td>
                        <td class="p-2.5 text-center font-mono font-bold text-blue-400">
                          ${pgDisplay} ${r.unit && r.pg != null ? `<span class="text-[10px] font-normal text-[var(--muted-foreground)]">${r.unit}</span>` : ''}
                        </td>
                        <td class="p-2.5 text-center font-mono text-[var(--muted-foreground)]">
                          ${totDisplay}
                        </td>
                        <td class="p-2.5 text-right font-mono">
                          ${diffDisplay}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <p class="text-[11px] text-[var(--muted-foreground)] pt-1 italic">
              * Sanity check compares the ${(N || N_SIMS_PER_GAME).toLocaleString()}-simulation projection against the player's recorded 2026 NFL regular season statistics. Positive diffs indicate a favorable projected matchup or game script.
            </p>
          </div>
        </div>
      `;
    }

    function openModal(gid) {
      activeModalGid = gid;
      const g = GAMES_DATA.find(x => x.game_id === gid);
      if (!g) return;

      document.getElementById('modal-title').innerHTML = `
        <div class="flex items-center gap-2">
          <span>${g.away_name}</span> 
          <span class="text-xs text-[var(--muted-foreground)]">@</span> 
          <span>${g.home_name}</span>
          <span class="text-xs font-normal text-[var(--muted-foreground)]">(${g.weekday} ${g.gametime})</span>
        </div>
      `;

      if (gid !== lastLoadedModalGid) {
        comboLegs = [];
        if (g.sim_samples) initComboLegs(g);
        lastLoadedModalGid = gid;
      }

      activeTeamSide = 'away';
      activePosFilter = 'ALL';
      activeFantasyPlayerId = null;
      activeFantasyStat = 'fantasy_pts';
      histThresholdVal = null;

      switchModalTab('fantasy');
      document.getElementById('game-modal').classList.remove('hidden');
      if (!g.sim_samples) {
        ensureGameSamples(gid);
      }
    }

    function closeModal() {
      document.getElementById('game-modal').classList.add('hidden');
    }

    function resetFilters() {
      currentFilterDay = 'all';
      searchQuery = '';
      currentSort = 'time';
      document.getElementById('search-input').value = '';
      document.getElementById('sort-select').value = 'time';
      document.querySelectorAll('.filter-day-btn').forEach(btn => {
        if (btn.dataset.day === 'all') {
          btn.className = 'filter-day-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--primary)] text-white shadow-sm transition';
        } else {
          btn.className = 'filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition';
        }
      });
      renderGames();
    }

    // Event Listeners
    document.getElementById('day-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-day-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-day-btn').forEach(b => {
        b.className = 'filter-day-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--border)] transition';
      });
      btn.className = 'filter-day-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--primary)] text-white shadow-sm transition';
      currentFilterDay = btn.dataset.day;
      renderGames();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderGames();
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderGames();
    });

    document.getElementById('game-modal').addEventListener('click', (e) => {
      if (e.target.id === 'game-modal') closeModal();
    });

    // Initial render
    renderGames();
  </script>
</body>
</html>
